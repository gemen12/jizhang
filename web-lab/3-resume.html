```html
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>个人简历</title>
    <style>
        body {
            background-color: #f5f7fa;
            font-family: "微软雅黑", "Microsoft YaHei", sans-serif;
        }
        .container {
            width: 600px;
            margin: 40px auto;
            padding: 30px 40px;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #eaf5ff;
        }
        th, td {
            border: 1px solid #7fb3d5;
            padding: 12px 20px;
        }
        th {
            width: 100px;
            background-color: #d0e8fb;
        }
        h2 {
            margin-top: 30px;
            font-size: 18px;
        }
        ul {
            padding-left: 25px;
        }
        li {
            margin: 8px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>个人简历</h1>
        <table>
            <tr><th>姓名</th><td>奥某某</td></tr>
            <tr><th>性别</th><td>男</td></tr>
            <tr><th>年龄</th><td>22</td></tr>
            <tr><th>民族</th><td>汉</td></tr>
            <tr><th>学历</th><td>本科</td></tr>
        </table>
        <h2>我的爱好</h2>
        <ul>
            <li>篮球</li>
            <li>音乐</li>
        </ul>
    </div>
</body>
</html>
