<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>浮动和页面布局</title>
    <style>
        .container {
            width: 90%;
            margin: 30px auto;
            border: 1px solid #cccccc;
            overflow: hidden;
        }
        .left {
            float: left;
            width: 200px;
            height: 300px;
            background-color: #4a90d9;
            color: #ffffff;
            text-align: center;
            line-height: 300px;
        }
        .right {
            float: left;
            width: 300px;
            height: 300px;
            background-color: #e74c3c;
            color: #ffffff;
            text-align: center;
            line-height: 300px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left">左侧菜单</div>
        <div class="right">右侧内容区</div>
    </div>
</body>
</html>
